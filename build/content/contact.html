title: Demander ma page | tonsite.beaute
description: Formulaire de demande, sans appel.
noindex: no
sitemap: 3
---

<section><div class="wrap" style="max-width:820px">
<h1>Demander ma page</h1>
<p>Dix questions, sans appel. On vous répond par message avec un devis ou une question.</p>
<div class="alert" id="mode-note"></div>
<form id="intake" novalidate>
<label for="formule">Formule</label>
<select id="formule" name="formule" required>
<option value="">Choisir</option><option value="solo">Solo, 480 € par an</option><option value="salon">Salon, 600 € par an</option><option value="test">Place de test gratuite</option><option value="question">Juste une question</option>
</select>
<label for="metier">Vous êtes</label>
<select id="metier" name="metier" required>
<option value="">Choisir</option>
<option>Prothésiste ongulaire, technicienne cils ou sourcils, esthéticienne en solo</option>
<option>Coiffeuse ou coiffeur à domicile</option>
<option>Salon de coiffure</option>
<option>Institut de beauté avec équipe</option>
<option>Autre</option>
</select>
<div class="row">
<div><label for="nom">Votre prénom et nom</label><input id="nom" name="nom" autocomplete="name" required></div>
<div><label for="commerce">Nom du salon ou de l'activité</label><input id="commerce" name="commerce" required></div>
</div>
<div class="row">
<div><label for="ville">Ville</label><input id="ville" name="ville" autocomplete="address-level2" required></div>
<div><label for="insta">Votre Instagram ou TikTok</label><input id="insta" name="insta" placeholder="@votrecompte"></div>
</div>
<label for="outil">Aujourd'hui, vos clientes réservent comment ?</label>
<select id="outil" name="outil" required>
<option value="">Choisir</option><option>DM, SMS ou téléphone</option><option>Planity</option><option>Fresha</option><option>Booksy</option><option>Treatwell</option><option>Autre outil</option>
</select>
<label for="lien">Votre lien de réservation (si vous en avez un)</label><input id="lien" name="lien" type="url" placeholder="https://">
<div class="row">
<div><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
<div><label for="tel">Téléphone (facultatif)</label><input id="tel" name="tel" type="tel" autocomplete="tel"></div>
</div>
<label for="message">Ce que vous voulez sur votre page (prestations, ambiance, question)</label><textarea id="message" name="message"></textarea>
<label class="check"><input type="checkbox" id="rgpd" name="rgpd" required> J'ai lu la <a href="confidentialite.html">notice de confidentialité</a>. Mes réponses servent uniquement à préparer mon devis et ma page.</label>
<p><button class="btn" type="submit">Envoyer ma demande</button></p>
<p id="form-error" class="draft" hidden></p>
</form>
<div id="result" hidden>
<h2>Votre demande est prête</h2>
<p id="result-text"></p>
<textarea id="summary" readonly style="min-height:220px"></textarea>
<p><button class="btn dark" type="button" id="copy">Copier ma demande</button> <a class="btn" href="https://ig.me/m/tonsitebeaute" id="dm">Ouvrir Instagram</a></p>
</div>
</div></section>
<script>window.AGENCY_EMAIL = 'tonsitebeaute@gmail.com';</script>
<script src="assets/form.js"></script>
